# allow mouse control
set -g mouse on

# start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -sg escape-time 10

# reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# --- Keybinding ---
# remap prefix from 'C-b' to 'C-f'
unbind C-b
set-option -g prefix C-f
bind-key C-f send-prefix

# navigate with hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes with HJKL
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# split panes using | and -, and start pane in current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Clipboard ---
# use system clipboard for copy-paste
set-option -g set-clipboard on

# enable vi mode for copy mode
setw -g mode-keys vi

# pick the clipboard tool for this machine
if-shell 'uname | grep -q Darwin' \
  'set -s copy-command "pbcopy"' \
  'if-shell "command -v wl-copy" \
     "set -s copy-command \"wl-copy\"" \
     "set -s copy-command \"xclip -selection clipboard -i\""'

# bind copy mode to use system clipboard
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

bind-key -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel

# bind mouse selection to copy to system clipboard
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel


# --- Display ---
set -g default-terminal "tmux-256color"   # colors!
set -ga terminal-overrides ",xterm-256color:RGB,xterm-kitty:RGB"
setw -g xterm-keys on
set -sg repeat-time 600                   # increase repeat timeout
set -s focus-events on

# Status bar position
set -g status-position bottom

# Status bar alignment
set -g status-justify centre

# Status bar content (no date/time)
set -g status-left ""
set -g status-right ""

# Vague colour scheme
# Status bar general styling
set -g status-style fg=#cdcdcd,bg=#18191a

# Active window in status bar
set-window-option -g window-status-current-style bg=#f29e74,fg=#18191a

# Inactive windows in status bar
set-window-option -g window-status-style fg=#6e6e6e,bg=#18191a

# Pane border colours
set -g pane-border-style fg=#2a2a2a
set -g pane-active-border-style fg=#f29e74

# Message styling
set -g message-style fg=#cdcdcd,bg=#18191a
set -g message-command-style fg=#cdcdcd,bg=#18191a

# Window status format
set -g window-status-current-format " #I:#W "
set -g window-status-format " #I:#W "
set -g window-status-separator " "

# --- Plugin manager!! be careful... ---
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/.tmux/plugins/tpm/tpm'
