# Noir colour scheme for tmux — monochrome statusline

# Status bar general styling
set -g status-style fg=#6b6b73,bg=#0a0a0b

# Active window in status bar
set-window-option -g window-status-current-style fg=#ececec,bg=#28282c

# Inactive windows in status bar
set-window-option -g window-status-style fg=#6b6b73,bg=#0a0a0b

# Pane border colours
set -g pane-border-style fg=#28282c
set -g pane-active-border-style fg=#ececec

# Message styling
set -g message-style fg=#c9c9c9,bg=#161618
set -g message-command-style fg=#c9c9c9,bg=#161618
