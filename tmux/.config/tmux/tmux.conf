# allow mouse control
set -g mouse on

# start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -sg escape-time 10

# reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# --- Keybinding ---
# remap prefix from 'C-b' to 'C-f'
unbind C-b
set-option -g prefix C-f
bind-key C-f send-prefix

# navigate with hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes with HJKL
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# split panes using | and -, and start pane in current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# rename pane
bind t command-prompt -p "Pane title:" "select-pane -T '%%'"

# --- Pane hiding ---
# tmux cannot hide a pane in place, so m parks the current pane in a
# background window named "hidden" (created on demand, never visited) and
# M pulls every parked pane back into the current window. The hidden
# window removes itself once its last pane is pulled back.
bind m if-shell 'tmux list-windows -F "##W" | grep -qx hidden' \
	'join-pane -d -t :hidden' \
	'break-pane -d -n hidden ; set-option -w -t :hidden automatic-rename off'
bind M run-shell 'for p in $(tmux list-panes -t :hidden -F "##{pane_id}" 2>/dev/null); do tmux join-pane -h -s "$p" -t "#{window_id}"; done'

# --- Clipboard ---
# use system clipboard for copy-paste
set-option -g set-clipboard on

# enable vi mode for copy mode
setw -g mode-keys vi

# bind copy mode to use system clipboard
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

bind-key -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel "wl-copy"

# bind mouse selection to copy to system clipboard
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"


# --- Display ---
set -g default-terminal "screen-256color" # colors!
setw -g xterm-keys on
set -s escape-time 10                     # faster command sequences
set -sg repeat-time 600                   # increase repeat timeout
set -s focus-events on

# Display pane titles in borders
set -g pane-border-status top
set -g pane-border-format " #{pane_index} #{pane_title} "

# Status bar position
set -g status-position bottom

# Status bar alignment
set -g status-justify centre

# Status bar content (no date/time)
set -g status-left ""
set -g status-right ""

# Colour scheme
# Switch between themes by changing the source line:
# - themes/noir.conf
# - themes/vague.conf
# - themes/blue-matrix.conf
source-file ~/.config/tmux/themes/noir.conf

# Window status format
set -g window-status-current-format " #I:#W "
set -g window-status-format " #I:#W "
set -g window-status-separator " "

# --- Plugin manager!! be careful... ---
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Session persistence across reboots
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-continuum settings
set -g @continuum-restore 'on'  # auto-restore sessions on tmux start
set -g @continuum-save-interval '5'  # auto-save every 5 minutes

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/.tmux/plugins/tpm/tpm'
