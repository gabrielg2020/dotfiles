# Noir theme for Kitty
# vim:ft=kitty
## name:  Noir
## blurb: Near-black monochrome chrome; muted pastel ANSI colours so code keeps its voice.

foreground               #c9c9c9
background               #0a0a0b
selection_foreground     #ececec
selection_background     #28282c
cursor                   none
url_color                #9bb4bc

active_border_color      #ececec
inactive_border_color    #28282c

# Blacks / greys
color0   #161618
color8   #6b6b73

# Muted pastels — colour lives in output and code, not in the chrome
color1   #d8647e
color9   #e08398
color2   #7fa563
color10  #99b782
color3   #e8b589
color11  #f5cb96
color4   #6e94b2
color12  #8ba9c1
color5   #bb9dbd
color13  #c9b1ca
color6   #9bb4bc
color14  #bebeda
color7   #c9c9c9
color15  #ececec

active_tab_foreground    #ececec
active_tab_background    #28282c
inactive_tab_foreground  #6b6b73
inactive_tab_background  #0a0a0b
