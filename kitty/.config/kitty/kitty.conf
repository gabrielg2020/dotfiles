# Font family
font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

# Font size
font_size 12.0

# Font features (for fonts that support ligatures)
font_features FiraCode-Regular +cv02 +cv05 +cv09 +cv14 +ss04 +cv16 +cv31 +cv25 +cv26 +cv32 +cv28 +ss10 +zero +onum

# Font rendering
adjust_line_height  0
adjust_column_width 0

# Window padding
window_padding_width 0

background_opacity 1
background_blur 1

dynamic_background_opacity yes

# URL handling
open_url_with default
mouse_map ctrl+left click ungrabbed mouse_handle_click selection link prompt

# Custom Keymappings
## Copy/Paste keybindings
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard

# Colour theme
# Switch between themes by changing the include line:
# - themes/vague.conf
# - themes/blue-matrix.conf

include themes/blue-matrix.conf
