# Noir lock screen — blurred screenshot of the desktop, mono clock, thin input bar

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.35
    contrast = 0.9
}

# Clock — HH:MM:SS
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M:%S"
    color = rgb(ececec)
    font_size = 72
    font_family = FiraCode Nerd Font Mono
    position = 0, 160
    halign = center
    valign = center
}

# Date — DD/MM/YYYY
label {
    monitor =
    text = cmd[update:60000] date +"%d/%m/%Y"
    color = rgb(6b6b73)
    font_size = 20
    font_family = FiraCode Nerd Font Mono
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 44
    outline_thickness = 1
    rounding = 0
    outer_color = rgb(28282c)
    inner_color = rgb(0a0a0b)
    font_color = rgb(c9c9c9)
    font_family = FiraCode Nerd Font Mono
    placeholder_text = ...
    fail_text = nope
    check_color = rgb(6e94b2)
    fail_color = rgb(d8647e)
    dots_size = 0.25
    dots_spacing = 0.3
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
